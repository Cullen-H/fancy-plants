<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fancy Plants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=0.18">
</head>
<body>
  <div id="stage">
    <canvas id="farm"></canvas>

    <header id="topbar">
      <div class="top-left">
        <div class="logo">Fancy Plants</div>
        <button id="level" class="level-chip" title="Farm level">
          <b id="level-num">1</b>
          <span class="level-text"><span id="level-label">Level 1</span><span class="xp"><i id="xp-bar"></i></span></span>
        </button>
      </div>
      <button id="weather" class="weather">
        <img alt="">
        <span class="weather-text"><b id="weather-name"></b><span id="weather-time"></span></span>
        <span class="clock-divider"></span>
        <img id="clock-icon" alt="">
        <span class="weather-text"><b id="clock-name"></b><span id="clock-time"></span></span>
      </button>
      <div class="top-right">
        <div id="coins" class="coins" title="Coins">
          <span class="coin-icon"></span><span id="coin-count">0</span>
        </div>
        <button id="options-btn" class="gear" title="Options" aria-label="Options">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
      </div>
    </header>

    <aside id="dock">
      <nav id="tabs">
        <button data-tab="shop" class="active">Shop</button>
        <button data-tab="sell">Sell<span id="basket-count" class="badge" hidden></span></button>
        <button data-tab="upgrades">Upgrades</button>
        <button data-tab="goals">Goals<span id="goal-count" class="badge" hidden></span></button>
        <button data-tab="guide">Guide</button>
      </nav>
      <section id="panel"></section>
    </aside>

    <div id="floors" class="floors" hidden>
      <button data-dir="1" title="Go up a floor (Page Up)">&#9650;<span class="badge" hidden></span></button>
      <b id="floor-label">1</b>
      <button data-dir="-1" title="Go down a floor (Page Down)">&#9660;<span class="badge" hidden></span></button>
    </div>

    <footer id="hotbar">
      <div id="slots"></div>
      <button id="harvest-all" class="btn">Harvest all</button>
    </footer>

    <canvas id="fx"></canvas>
    <div id="popup" class="popup" hidden></div>
    <img id="held" alt="">
    <div id="tip" class="tip" hidden></div>
    <div id="void" hidden>
      <canvas id="void-canvas"></canvas>
      <svg id="void-lines" viewBox="0 0 1280 720"></svg>
      <div id="void-nodes"></div>
      <div class="void-top">
        <div class="void-points"><b id="void-points">0</b> GMO Points<span id="void-rebirths"></span></div>
        <button id="void-back" class="btn">Back to the farm</button>
      </div>
      <div id="void-info"></div>
    </div>
    <div id="town" hidden>
      <canvas id="town-canvas"></canvas>
      <div class="town-top">
        <h1 class="town-title">Town</h1>
        <button id="town-back" class="btn">Back to the farm</button>
      </div>
      <div id="town-modal" hidden></div>
    </div>
    <div id="toasts"></div>
  </div>
  <div id="rotate">Turn your phone sideways to play.</div>

  <script src="js/util.js?v=0.18"></script>
  <script src="js/data.js?v=0.18"></script>
  <script src="js/time.js?v=0.18"></script>
  <script src="js/state.js?v=0.18"></script>
  <script src="js/farm.js?v=0.18"></script>
  <script src="js/goals.js?v=0.18"></script>
  <script src="js/sound.js?v=0.18"></script>
  <script src="js/progression.js?v=0.18"></script>
  <script src="js/workers.js?v=0.18"></script>
  <script src="js/special.js?v=0.18"></script>
  <script src="js/climate.js?v=0.18"></script>
  <script src="js/plants.js?v=0.18"></script>
  <script src="js/weather.js?v=0.18"></script>
  <script src="js/render.js?v=0.18"></script>
  <script src="js/blackhole.js?v=0.18"></script>
  <script src="js/town.js?v=0.18"></script>
  <script src="js/ui.js?v=0.18"></script>
  <script src="js/requests.js?v=0.18"></script>
  <script src="js/tutorial.js?v=0.18"></script>
  <script src="js/main.js?v=0.18"></script>
  <script src="js/dev.js?v=0.18"></script>
</body>
</html>
